name: Generate 3D Contribution

on:
  schedule:           # daily (UTC) — optional
    - cron: '0 0 * * *'
  workflow_dispatch:  # allows manual run from Actions UI

permissions:
  contents: write     # <-- required so the Action can commit generated images

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Generate 3D contribution images
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: generated 3d contribution graph" || echo "No changes to commit"
          git push
